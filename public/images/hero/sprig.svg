<svg xmlns="http://www.w3.org/2000/svg" width="200" height="340" viewBox="0 0 200 340" fill="none" stroke="#7C8060" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <defs>
    <!-- A single elegant leaf: pointed oval with a centre vein. -->
    <g id="leaf">
      <path d="M0 0 C 13 -8 36 -8 52 0 C 36 8 13 8 0 0 Z" />
      <path d="M6 0 L 46 0" stroke-opacity="0.6" />
