    <use href="#leaf" transform="translate(112 272) rotate(330) scale(0.98)" />
    <use href="#leaf" transform="translate(112 242) rotate(206) scale(0.93)" />
    <use href="#leaf" transform="translate(115 214) rotate(332) scale(0.9)" />
    <use href="#leaf" transform="translate(116 184) rotate(204) scale(0.83)" />
    <use href="#leaf" transform="translate(120 156) rotate(334) scale(0.8)" />
    <use href="#leaf" transform="translate(122 128) rotate(204) scale(0.72)" />
    <use href="#leaf" transform="translate(128 102) rotate(336) scale(0.68)" />
    <use href="#leaf" transform="translate(130 78) rotate(206) scale(0.58)" />
    <use href="#leaf" transform="translate(138 56) rotate(338) scale(0.54)" />
    <!-- the tip bud, pointing up -->
