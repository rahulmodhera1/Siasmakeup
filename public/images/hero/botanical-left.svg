<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 700" fill="none" aria-hidden="true">
  <defs>
    <!-- Large lance leaf, pointing right from origin -->
    <g id="lA">
      <path d="M0,0 C5,-10 22,-14 36,-11 C46,-5 46,5 36,11 C22,14 5,10 0,0Z"
            fill="#7C8060" fill-opacity="0.14" stroke="#7C8060" stroke-width="0.95" stroke-opacity="0.62"/>
      <path d="M5,0 L32,0 M14,-6 L28,-2 M14,6 L28,2"
            stroke="#7C8060" stroke-width="0.45" stroke-opacity="0.38" stroke-linecap="round"/>
    </g>
    <!-- Medium leaf -->
    <g id="lB">
      <path d="M0,0 C4,-8 17,-11 28,-8 C37,-4 37,4 28,8 C17,11 4,8 0,0Z"
            fill="#7C8060" fill-opacity="0.13" stroke="#7C8060" stroke-width="0.9" stroke-opacity="0.6"/>
      <path d="M4,0 L24,0 M11,-5 L22,-1 M11,5 L22,1"
            stroke="#7C8060" stroke-width="0.4" stroke-opacity="0.35" stroke-linecap="round"/>
    </g>
    <!-- Small leaf -->
    <g id="lC">
      <path d="M0,0 C3,-6 12,-8 20,-6 C27,-3 27,3 20,6 C12,8 3,6 0,0Z"
            fill="#7C8060" fill-opacity="0.12" stroke="#7C8060" stroke-width="0.85" stroke-opacity="0.55"/>
      <path d="M3,0 L17,0"
            stroke="#7C8060" stroke-width="0.38" stroke-opacity="0.32" stroke-linecap="round"/>
    </g>
    <!-- Tiny tip leaf -->
    <g id="lT">
      <path d="M0,0 C2,-4 8,-6 14,-4 C19,-2 19,2 14,4 C8,6 2,4 0,0Z"
            fill="#7C8060" fill-opacity="0.11" stroke="#7C8060" stroke-width="0.75" stroke-opacity="0.5"/>
    </g>
  </defs>

  <!-- ══ MAIN STEM — graceful upward curve ══ -->
  <path d="M58,700 C65,610 68,518 80,432 C92,348 107,270 119,196 C129,136 137,82 144,22"
        stroke="#7C8060" stroke-width="1.55" stroke-linecap="round" stroke-opacity="0.72"/>

  <!-- ══ LEFT SUB-BRANCH (from ~y=445) ══ -->
  <path d="M79,445 C62,434 42,428 20,426 C12,426 5,427 0,428"
        stroke="#7C8060" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.58"/>

  <!-- ══ RIGHT SUB-BRANCH (from ~y=285) ══ -->
  <path d="M110,290 C128,280 148,274 166,271 C176,269 186,269 194,270"
        stroke="#7C8060" stroke-width="1.05" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- ══ SMALL LEFT TWIG (from ~y=168) ══ -->
  <path d="M126,172 C112,162 95,154 76,151"
        stroke="#7C8060" stroke-width="0.88" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- ══ LEAVES ON MAIN STEM ══ -->
  <!-- Right side: rotate ~-28 to -18 (droop right-downward); Left: ~205 to 195 -->

  <use href="#lA" transform="translate(60,655) rotate(-32)"/>
  <use href="#lA" transform="translate(62,616) rotate(207)"/>
  <use href="#lA" transform="translate(65,577) rotate(-30)"/>
  <use href="#lA" transform="translate(68,538) rotate(206)"/>
  <use href="#lA" transform="translate(72,500) rotate(-28)"/>
  <use href="#lA" transform="translate(76,462) rotate(205)"/>
  <use href="#lB" transform="translate(81,424) rotate(-26)"/>
  <use href="#lB" transform="translate(87,386) rotate(204)"/>
  <use href="#lB" transform="translate(93,350) rotate(-25)"/>
  <use href="#lB" transform="translate(99,314) rotate(203)"/>
  <use href="#lB" transform="translate(105,278) rotate(-23)"/>
  <use href="#lC" transform="translate(111,244) rotate(202)"/>
  <use href="#lC" transform="translate(117,210) rotate(-22)"/>
  <use href="#lC" transform="translate(122,178) rotate(201)"/>
  <use href="#lC" transform="translate(127,146) rotate(-20)"/>
  <use href="#lC" transform="translate(131,116) rotate(200)"/>
  <use href="#lT" transform="translate(136,88)  rotate(-19)"/>
  <use href="#lT" transform="translate(139,62)  rotate(199)"/>
  <use href="#lT" transform="translate(142,38)  rotate(-17)"/>
  <use href="#lT" transform="translate(144,18)  rotate(198)"/>

  <!-- ══ LEAVES ON LEFT SUB-BRANCH ══ -->
  <use href="#lB" transform="translate(62,437) rotate(195)"/>
  <use href="#lB" transform="translate(44,431) rotate(-22)"/>
  <use href="#lC" transform="translate(26,428) rotate(194)"/>
  <use href="#lT" transform="translate(10,427) rotate(-18)"/>

  <!-- ══ LEAVES ON RIGHT SUB-BRANCH ══ -->
  <use href="#lB" transform="translate(130,282) rotate(-165)"/>
  <use href="#lB" transform="translate(150,275) rotate(-24)"/>
  <use href="#lC" transform="translate(168,271) rotate(-163)"/>
  <use href="#lT" transform="translate(182,270) rotate(-22)"/>

  <!-- ══ LEAVES ON SMALL LEFT TWIG ══ -->
  <use href="#lC" transform="translate(113,164) rotate(195)"/>
  <use href="#lC" transform="translate(95,155) rotate(-18)"/>
  <use href="#lT" transform="translate(79,152) rotate(194)"/>
</svg>
